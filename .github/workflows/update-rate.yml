name: Update rate data

on:
  workflow_dispatch:
  schedule:
    # 18:30 KST every day.
    - cron: "30 9 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update CSV
        run: python3 update_rates.py

      - name: Rebuild chart
        run: python3 plot_chart.py --no-open

      - name: Commit changes
        run: |
          if git diff --quiet -- rate.csv chart.html; then
            echo "No rate updates."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rate.csv chart.html
          git commit -m "Update rate data"
          git push

      - name: Prepare Pages artifact
        run: |
          mkdir -p site
          cp chart.html site/index.html
          cp chart.html site/chart.html
          cp rate.csv site/rate.csv

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
