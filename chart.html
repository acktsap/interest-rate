                    labelBackgroundColor: '#2a2e39',
                },
                horzLine: {
                    width: 1,
                    color: '#758696',
                    style: LightweightCharts.LineStyle.Dashed,
                    labelBackgroundColor: '#2a2e39',
                },
            },
            rightPriceScale: {
                borderColor: '#2a2e39',
                scaleMargins: {
                    top: 0.1,
                    bottom: 0.1,
                },
            },
            timeScale: {
                borderColor: '#2a2e39',
                timeVisible: true,
                secondsVisible: false,
            },
            handleScroll: {
                mouseWheel: true,
                pressedMouseMove: true,
                horzTouchDrag: true,
                vertTouchDrag: true,
            },
            handleScale: {
                axisPressedMouseMove: true,
                mouseWheel: true,
                pinch: true,
            },
        });

        // 6월물 시리즈 (파란색)
        const series6m = chart.addSeries(LightweightCharts.AreaSeries, {
            lineColor: '#2962FF',
            topColor: 'rgba(41, 98, 255, 0.3)',
            bottomColor: 'rgba(41, 98, 255, 0.0)',
            lineWidth: 2,
            priceFormat: {
                type: 'price',
                precision: 3,
                minMove: 0.001,
            },
        });
        series6m.setData(data6m);

        // 5년물 시리즈 (주황색)
        const series5y = chart.addSeries(LightweightCharts.LineSeries, {
            color: '#FF6D00',
            lineWidth: 2,
            priceFormat: {
                type: 'price',
                precision: 3,
                minMove: 0.001,
            },
        });
        series5y.setData(data5y);

        // 크로스헤어 이동 시 값 표시
        chart.subscribeCrosshairMove((param) => {
            const legend = document.getElementById('legend');
            if (param.time) {
                const price6m = param.seriesData.get(series6m);
                const price5y = param.seriesData.get(series5y);
                let html = '';
                if (price6m) {
                    html += `<span style="color: #2962FF">●</span> 6월: ${price6m.value.toFixed(3)}%&nbsp;&nbsp;`;
                }
                if (price5y) {
                    html += `<span style="color: #FF6D00">●</span> 5년: ${price5y.value.toFixed(3)}%`;
                }
                legend.innerHTML = html;
            } else {
                legend.innerHTML = '';
            }
        });

        // 차트 크기 자동 조절
        window.addEventListener('resize', () => {
            chart.applyOptions({
                width: window.innerWidth,
                height: window.innerHeight - 60
            });
        });

        chart.timeScale().fitContent();
    </script>
</body>
</html>
